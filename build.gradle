plugins {
    id 'io.github.goooler.shadow' version '8.1.7' apply false
    id 'com.modrinth.minotaur' version "2.+" apply false // modrinth publishing

    id 'org.spongepowered.gradle.vanilla' version '0.2.1-SNAPSHOT' apply false

    id 'dev.huskuraft.fuse' apply false
}

apply from: 'patch.gradle'

if (System.getenv('CI') == null) {
    allprojects {
        repositories.configureEach { repository ->
            if (repository instanceof MavenArtifactRepository) {
                def repositoryUrl = repository.url.toString()
                if (repositoryUrl.contains('libraries.minecraft.net')) {
                    repository.url = uri('https://bmclapi2.bangbang93.com/maven/')
                } else if (repositoryUrl.contains('repo.maven.apache.org/maven2')) {
                    repository.url = uri('https://maven.aliyun.com/repository/public')
                } else if (repositoryUrl.contains('repo1.maven.org/maven2')) {
                    repository.url = uri('https://maven.aliyun.com/repository/public')
                }
            }
        }
    }
}
