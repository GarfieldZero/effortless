name: Java CI with Gradle

on:
  pull_request:
    branches: ['**']
  push:
    branches:
      - master
      - survival-1.20.1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'

      - name: Compile Fabric and Forge
        run: gradle :fabric:mc-1-20-1:compileJava :forge:mc-1-20-1:compileJava --console=plain

      - name: Build fused JAR
        run: gradle :multiplatform:mc-1-20-1:fuseJar --console=plain
