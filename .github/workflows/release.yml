name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  github-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build fused Fabric and Forge JAR
        run: ./gradlew :multiplatform:mc-1-20-1:fuseJar --console=plain

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: multiplatform/mc-1-20-1/build/libs/*.jar
          generate_release_notes: true
